<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Server Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#111;color:#fff}header{background:#1b1b1b;padding:25px;text-align:center;border-bottom:2px solid #444}header h1{margin:0;font-size:28px}header p{color:#999;margin-bottom:0}.container{max-width:1000px;margin:auto;padding:30px 20px}.servers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.server{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:25px}.server h2{margin-top:0}.status{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold;margin-bottom:15px}.online{background:#1f6b3a;color:#aaffc3}.offline{background:#6b1f1f;color:#ffaaaa}.unknown{background:#665b1f;color:#fff0a0}.info p{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #333;padding:8px 0;margin:0}.label{color:#999}#updated{text-align:center;color:#777;margin-top:30px;font-size:13px}footer{text-align:center;padding:20px;color:#666}
</style></head><body><header><h1>🎮 Mein Game Server</h1><p>Server Status & Informationen</p></header><div class="container"><div class="servers">
<div class="server"><h2>🇺🇸 America's Army 2.5</h2><div id="aa-status" class="status unknown">● WIRD GELADEN</div><div class="info"><p><span class="label">Server IP</span><span id="aa-ip">-</span></p><p><span class="label">Port</span><span id="aa-port">-</span></p><p><span class="label">Spieler</span><span id="aa-players">-</span></p><p><span class="label">Map</span><span id="aa-map">-</span></p><p><span class="label">Servername</span><span id="aa-name">-</span></p></div></div>
<div class="server"><h2>🔫 Teeworlds</h2><div id="tw-status" class="status offline">● NOCH NICHT INSTALLIERT</div><div class="info"><p><span class="label">Server IP</span><span id="tw-ip">-</span></p><p><span class="label">Port</span><span id="tw-port">8303</span></p><p><span class="label">Spieler</span><span id="tw-players">-</span></p><p><span class="label">Map</span><span id="tw-map">-</span></p></div></div>
</div><div id="updated">Lade Serverdaten...</div></div><footer>Game Server Dashboard</footer>
<script>
async function loadStatus(){try{const r=await fetch("status.json?t="+Date.now());const d=await r.json();const a=d.aa25;
["ip","port","map","name"].forEach(k=>document.getElementById("aa-"+k).textContent=a[k]??"-");
document.getElementById("aa-players").textContent=(a.players??0)+" / "+(a.maxPlayers??0);
const s=document.getElementById("aa-status");s.textContent=a.status==="online"?"● ONLINE":"● OFFLINE";s.className="status "+(a.status==="online"?"online":"offline");
const t=d.teeworlds;document.getElementById("tw-ip").textContent=t.ip||"-";document.getElementById("tw-port").textContent=t.port||"8303";document.getElementById("tw-players").textContent=t.players==null?"-":t.players+" / "+t.maxPlayers;document.getElementById("tw-map").textContent=t.map||"-";
document.getElementById("updated").textContent="Letzte Aktualisierung: "+d.updated}catch(e){console.error(e);document.getElementById("updated").textContent="⚠️ Serverdaten konnten nicht geladen werden."}}
loadStatus();setInterval(loadStatus,30000);
</script></body></html>
